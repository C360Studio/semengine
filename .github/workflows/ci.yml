name: CI

on:
  push:
    branches: [main]
  # Every PR gets CI whatever its base, so stacked PRs are covered too. Listing
  # types replaces GitHub's default three, so they are listed with
  # ready_for_review: marking a draft ready runs verify on the head. The merge
  # check is its own workflow, merge-check.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded PR runs are cancelled; pushes to main are not, so two quick merges
# never leave a cancelled Required on a commit that was never broken.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job is pinned to ubuntu-24.04 by the merge-gate spec. Moving to another
# image changes that spec; that change's CI run is task verify on the new image.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history, so scripts/tools-changed.sh can find the merge base with the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # .task-version is the single pin; task doctor compares against the same file.
      - name: Read Task version pin
        id: task-version
        run: echo "version=$(tr -d '[:space:]' < .task-version)" >> "$GITHUB_OUTPUT"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.task-version.outputs.version }}

      # The ateam pin; scripts/doctor.sh reads it from this line. ateam may need a newer Go
      # than go.mod, so the toolchain is fetched as needed.
      - name: Install ateam
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/c360studio/ateam/cmd/ateam@v0.3.4

      - run: task doctor

      # verify includes test:integration, which needs the runner's Docker daemon.
      - run: task verify

  # Single required status check: anything other than success in a needed job
  # (failure, cancelled, skipped, or a job that never ran) fails the aggregate.
  required:
    name: Required
    needs: [verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          if [ -z "$RESULTS" ]; then echo "no needed jobs reported"; exit 1; fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "required check did not succeed: $r"; exit 1; fi
          done
