name: CI

on:
  push:
    branches: [main]
  # Every PR gets CI whatever its base, so stacked PRs are covered too.
  pull_request:

# Superseded PR runs are cancelled; pushes to main are not, so two quick merges
# never leave a cancelled Required on a commit that was never broken.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # .task-version is the single pin; task doctor compares against the same file.
      - name: Read Task version pin
        id: task-version
        run: echo "version=$(tr -d '[:space:]' < .task-version)" >> "$GITHUB_OUTPUT"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.task-version.outputs.version }}

      - run: task doctor

      # verify includes test:integration, which needs the runner's Docker daemon and
      # takes the host lock at /tmp/semstreams-integration.lock.
      - run: task verify

      # Integration evidence (preflight, listings, fixture phase records, container
      # logs, coverage) is kept as an artifact, never committed. .evidence is a hidden
      # directory, which upload-artifact skips unless told otherwise.
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Known-flake check and up-to-date rule (scripts/merge-check.sh). It reads
  # GitHub, so it is a job of its own and not part of task verify. The token gets
  # these three reads and nothing else; a pull request from a fork or Dependabot
  # gets a read-only token, which is all the job needs. On a push to main the
  # number is empty and the script takes its push path.
  merge-check:
    name: Merge check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check known flakes and the up-to-date rule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/merge-check.sh "$PR_NUMBER"

  # Single required status check: anything other than success in a needed job
  # (failure, cancelled, skipped, or a job that never ran) fails the aggregate.
  required:
    name: Required
    needs: [verify, merge-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          if [ -z "$RESULTS" ]; then echo "no needed jobs reported"; exit 1; fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "required check did not succeed: $r"; exit 1; fi
          done
