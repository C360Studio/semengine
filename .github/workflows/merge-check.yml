name: Merge check

# The merge check (scripts/merge-check.sh, which runs ateam review gate) is a
# workflow and a required check of its own, apart from CI (openspec change
# adopt-ateam-merge-gate, design D1), as ateam runs it:
#
# - It reads the pull request's state (the review record, the reviewed-by:
#   line, open class:flake issues), so it runs on edited too: the reviewer's
#   description edit reaches it without rerunning Verify.
# - One run per pull request at a time, queued: a newer event replaces a
#   pending run, and a running one finishes rather than being cancelled, so
#   no cancelled Merge check sits beside a passing one at the same head.
# - It judges from the base commit: the script and the review policy it reads
#   come from main, never from the tree under review, so a pull request cannot
#   loosen them. This file is not: on pull_request GitHub runs the workflow
#   from the pull request's merge ref, so its jobs and the ateam pin in its
#   install lines are part of the tree under review (#471). The pull request
#   itself is read through the API.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The awaiting probe (ateam #262): it checks out the base commit and installs
  # the ateam pin as the merge check does, reads the pull request through the
  # API, and answers awaiting=true only for a code pull request with no
  # reviewed-by: line and no review record comment. It reads the pull request when it runs, so a rerun
  # sees the description and records of that moment. The main ruleset does not
  # require it.
  awaiting:
    name: Merge check probe
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      awaiting: ${{ steps.probe.outputs.awaiting }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The same ateam pin as the merge-check job's below.
      - name: Install ateam
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/c360studio/ateam/cmd/ateam@v0.3.9

      - name: Is the pull request awaiting its review record
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          out=$(ateam review gate --awaiting "$PR_NUMBER")
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -xE 'awaiting=(true|false)' >> "$GITHUB_OUTPUT"

  # Skipped and renamed on a draft, so a draft head carries no check run named
  # Merge check for GitHub to count as passing. Also skipped and renamed while
  # the probe finds a code pull request with no reviewed-by: line and no review
  # record: it is not yet judgeable, so the required check stays absent instead
  # of failing. A failed probe leaves no answer, so the full check runs.
  merge-check:
    needs: awaiting
    name: ${{ github.event.pull_request.draft && 'Merge check (draft, skipped)' || needs.awaiting.outputs.awaiting == 'true' && 'Merge check (awaiting review record, skipped)' || 'Merge check' }}
    if: ${{ always() && !github.event.pull_request.draft && needs.awaiting.outputs.awaiting != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The ateam pin, the same release as ci.yml's (scripts/doctor.sh compares them). ateam may
      # need a newer Go than go.mod, so the toolchain is fetched as needed.
      - name: Install ateam
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/c360studio/ateam/cmd/ateam@v0.3.9

      - name: Check the up-to-date rule, the review and its strength, and known flakes
        env:
          # Every check the main ruleset must require, so dropping one fails here.
          ATEAM_REQUIRED_CHECKS: Required,Merge check
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/merge-check.sh "$PR_NUMBER"
