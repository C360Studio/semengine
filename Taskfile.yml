version: '3'

# One entrypoint for local verification and CI; both run these same commands.
# Tool pins live in one place each: Go in go.mod, Node in .nvmrc, Task in
# .task-version, OpenSpec and markdownlint in package.json, revive and
# govulncheck in go.mod tool directives.

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  doctor:
    desc: Report tool versions and Docker reachability against their pins; starts no workloads
    cmds:
      - scripts/doctor.sh

  fmt:
    desc: Format Go sources (changes files)
    cmds:
      - 'echo "gofmt: $(find . -name ''*.go'' -not -path ''./node_modules/*'' | wc -l | tr -d '' '') Go file(s)"'
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go source needs formatting (no writes)
    cmds:
      - 'echo "gofmt: $(find . -name ''*.go'' -not -path ''./node_modules/*'' | wc -l | tr -d '' '') Go file(s)"'
      - |
        drift=$(gofmt -l .)
        if [ -n "$drift" ]; then echo "gofmt drift:"; echo "$drift"; exit 1; fi

  tidy:check:
    desc: Fail if go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff

  build:
    desc: Build all packages
    cmds:
      - scripts/gopkgs.sh go build ./...

  vet:
    desc: Run go vet
    cmds:
      - scripts/gopkgs.sh go vet ./...

  lint:
    desc: Run the pinned revive, then the carried fixed-port guard and its fixture test
    cmds:
      - scripts/gopkgs.sh go tool revive -config revive.toml -formatter friendly ./...
      # Adapted from SemStreams (ledger rows L9, L10; no exemption marker); tests may not bind fixed ports.
      - scripts/lint-test-ports.sh
      - scripts/lint-test-ports_fixture_test.sh

  cleanup-roots:check:
    desc: Fail if a test stops, closes, or terminates under an unbounded context.Background/TODO
    cmds:
      - scripts/cleanup-roots-check.sh

  ledger:check:
    desc: Validate docs/admission-ledger.yaml against its schema (T-B7), then fail if a carry entry differs from its SemStreams pin; fetches the pin from GitHub when a carry entry exists
    cmds:
      # Order and exit status are pinned by toolcheck test TestLedgerCheckWiring.
      - go test -count=1 -run '^TestAdmissionLedger' ./internal/harness/contract/
      - go run ./internal/harness/pindiff check

  ledger:diff:
    desc: Print how carry and adapt entries differ from their SemStreams pin; -- <source_path>... to name entries. Fetches the pin from GitHub
    cmds:
      - 'go run ./internal/harness/pindiff diff {{.CLI_ARGS}}'

  mutate:check:
    desc: Run by hand, never by verify or CI. Check that one named test detects one wrong change to a Go source file (-- -pkg -test -file -mutant -expect or -expect-text); writes nothing in the repository; fails unless the verdict is detection
    cmds:
      - 'go run ./internal/harness/mutcheck {{.CLI_ARGS}}'

  vuln:
    desc: Run the pinned govulncheck over all packages
    cmds:
      - scripts/gopkgs.sh go tool govulncheck ./...

  test:unit:
    desc: Run unit tests (every package but the tool packages) once with the race detector at one CPU (the integration run covers every CPU)
    vars:
      PKGS:
        sh: scripts/test-pkgs.sh unit
    cmds:
      - go test -race -count=1 -cpu 1 {{.PKGS}}

  test:repeat:
    desc: Run unit tests (every unit package but the repository guards in internal/harness/contract) five times at one CPU without the race detector, shuffled; -- <pkgs> to focus
    vars:
      PKGS:
        sh: scripts/test-pkgs.sh repeat
    cmds:
      # The count, the CPU setting and the absence of -race are pinned by the merge-gate spec
      # (toolcheck's TestUnitInvocationsPinned); one CPU without -race is the setting that found #40.
      - 'go test -count=5 -cpu 1 -shuffle=on {{.CLI_ARGS | default .PKGS}}'

  test:integration:
    desc: Run Docker-backed tests with plain go test over the packages with integration tests, shuffled, two packages at a time; on a pass, record the tree it measured for cover:check; -- <pkgs> to focus
    vars:
      PKGS:
        sh: scripts/test-pkgs.sh integration
    cmds:
      # Pinned by toolcheck's TestUnitInvocationsPinned (integration-test-runner spec). Task stops
      # at the first failing command, so the fingerprint exists only after go test passed.
      - rm -f coverage/integration.tree && mkdir -p coverage
      - 'go test -race -failfast -tags=integration -count=1 -p 2 -shuffle=on -timeout 10m -coverprofile=coverage/integration.coverprofile {{.CLI_ARGS | default .PKGS}}'
      - scripts/tree-state.sh > coverage/integration.tree

  test:tools:
    desc: Run the tool tests (mutcheck, pindiff, toolcheck, the tests of scripts, Taskfile.yml and CI) once with the race detector at one CPU
    vars:
      PKGS:
        sh: scripts/test-pkgs.sh tools
    cmds:
      - go test -race -count=1 -cpu 1 {{.PKGS}}

  test:tools:changed:
    desc: Run test:tools when a file the tool tests read changed against the base (scripts/, internal/harness/, .github/, Taskfile.yml, go.mod and others); otherwise say they were skipped
    cmds:
      - scripts/tools-changed.sh

  merge:check:
    desc: Fail while a class:flake issue is open that PR <n> does not close, main's rules lack the up-to-date setting, or PR <n> is a code PR, not a draft, without implemented-by and reviewed-by lines naming the agents; -- <n>. Reads GitHub, so not in verify
    cmds:
      - scripts/merge-check.sh {{.CLI_ARGS}}

  cover:check:
    desc: Fail below 80% coverage on each target listed in scripts/cover-check.sh, each measured from the unit run, the last integration run (natsfixture), or both merged
    cmds:
      - scripts/cover-check.sh

  spec:check:
    desc: Validate all OpenSpec changes and specs strictly, and fail on a hold written outside every task
    cmds:
      - npx --no-install openspec validate --all --strict --no-interactive
      - scripts/openspec-queue.sh --check

  spec:queue:
    desc: Show each in-flight OpenSpec change with its holds and blocking conditions
    cmds:
      - scripts/openspec-queue.sh

  status:
    desc: Print the Slice 04A 65-package port scoreboard, open PR claims, flakes, and milestone/issue hygiene (-- --offline, --check, or --sync-project); reads GitHub unless --offline
    cmds:
      - 'scripts/port-status.sh {{.CLI_ARGS}}'

  docs:check:
    desc: Lint Markdown with markdownlint-cli2
    cmds:
      - npx --no-install markdownlint-cli2 "**/*.md"

  verify:
    desc: Run every gate cheapest first with per-step timings; fail if tracked files change
    cmds:
      - scripts/verify.sh
