  contract: >-
    Start phases image→create→ready log→host→mapped 4222→connect→JetStream ready; failure record
    {attempt, phase, container id, parent state, cause, cleanup}; terminate a container returned with
    an error; Stop once, replayed
  dependencies_and_side_effects: >-
    testcontainers-go v0.44.0 (upstream pins v0.40.0, whose docker/docker client carries two unfixed
    advisories) and nats.go v1.54.0; creates a container per fixture; writes evidence files
  known_risks: >-
    production package imported testing/testcontainers upstream (not carried); mutable tag pin upstream
    (replaced by digest); eleven caller knobs upstream (dropped)
  proving_tests: >-
    natsfixture owner tests S1-1..S1-9; lifecycletest.Run over the fixture adapter; T-B1, T-B2, T-B3
