- source_path: natsclient
  source_sha: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
  consumer_purpose: >-
    the NATS and JetStream client: connection lifecycle with circuit breaker and health status,
    streams, consumers with delivery settlement, KV buckets and watchers, request/reply, storage
    inventory, pressure and reports, and JetStream metrics; SemSource imports it, so it stays public
    at its pin path (design D5)
  destination: natsclient
  contract: >-
    Client, its options and every exported operation as at the pin, less the surface named under
    known_risks as dropped. Changed behavior, design D9 (task 3.7): newJetStreamMetrics registers
    all 11 collectors through metric.RegisterOrGet and keeps the collector each call returns
    (jetstream_metrics.go:128-161 at the pin, where 8 went through the removed Register* methods,
    task 3.5a), so a second client on the same registry writes to the canonical collector. Changed
    behavior, design D9 (task 3.7d; owner ruling #9 comment 5969522395, item 4): the three consumer
    counters that added the server's current values on every poll (jetstream_metrics.go:305-307
    at the pin → :309-311, so each poll doubled them) are gauges set from server state:
    consumer_delivered_total → consumer_delivered_stream_sequence (Delivered.Stream),
    consumer_acked_total → consumer_ack_floor_stream_sequence (AckFloor.Stream),
    consumer_redelivered_total → consumer_redelivered_messages (NumRedelivered). No client label.
    Consumer impact: a dashboard, alert or query that names one of the three old metrics, or reads
    them as counters (rate(), increase()), finds no series under the old name and must use the new
    name as a gauge. The values also mean something else: the first two are stream sequence numbers,
    not message counts, and the third counts messages redelivered and not yet acknowledged, so it
    falls on acknowledgement (nats.go consumer_config.go:53-57). The other metric names and types and the semstreams namespace and jetstream
    subsystem are unchanged (#69). Changed surface, task 3.7a: the surface audit's drops listed under
    known_risks are gone, and with them the token, TLS and compression connection options and the
    disconnect, reconnect and health-change callbacks; pingInterval (30 s), drainTimeout (30 s),
    circuitThreshold (15) and maxBackoff (one minute) keep their defaults (client.go:161-166 at
    the pin → :149-154) with no setter, and requestHandlerTimeout is set only from
    SEMSTREAMS_NATS_REQUEST_HANDLER_TIMEOUT (request.go:37-55, name unchanged, #69). Changed
    behavior, task 3.7c (design D3), each an adapt item: natsclient-nil-context-refused, Close(nil)
    and Connect(nil) return an invalid error before any dial or close (client.go:689-691,
    :890-892; the pin panicked at :685 and :495, and Connect(nil) dialled at :494 first);
    natsclient-connect-refuses-second-start, a Connect on a connected client returns
    errs.ErrAlreadyStarted before it dials and changes nothing (:692-700), and a concurrent Connect
    that lost to another, by failing, by having its context end, or by dialling successfully second,
    leaves the winner's status, failure count and circuit as they were and closes what it dialled
    (the pin
    overwrote the connection at :547 and started a second poller at :566);
    natsclient-close-joins-its-goroutines,
    the six sites (the health monitor :2151, the metrics poller :868, the claim releases of both consumer
    APIs, now one site, owned_delivery.go:133, the connection-loss timer's body :2040 and the
    circuit timer's body :590) start through one helper, startBackground (:223), which under mu
    refuses once Close has begun and otherwise counts the work as client-owned (an owned-work
    count under mu, which the join waits to reach zero) before the goroutine starts; Connect admits the
    monitor and the poller through it. The first Close stops the monitor, both timers and the
    poller, drains and closes the
    connection, clears the connection and the JetStream handle, and only then sets Status to
    Disconnected (the status keeps its value through the drain), bounded by its own context. Every
    Close returns nil only when
    everything the client owns has finished, and ctx.Err() when its own context ends first or had
    already ended, without waiting for another Close's drain (:889-1018; the pin's second Close
    returned nil at once, :583-585, and no Close joined anything). Work offered once Close has begun is
    dropped, never run inline, and logged at debug level with its kind (:272-274): a goroutine
    start, a timer body that fired, and arming either timer (:561-575, :1984-2013). Work offered
    once Close has begun never starts; work admitted before it may still run, or enter its body,
    while Close waits for it. A Close called from inside a client callback returns ctx.Err() when
    its context ends and never nil (the pin returned at once). Also changed: Connect returns
    nats.ErrConnectionClosed when Close began after admission and refused the monitor or the
    poller (:803-805; the pin started both and returned nil); a consumer setup not yet admitted when
    Close begins releases its claim and never calls native
    Consume; one admitted before Close began may reach native Consume after it and is owned all
    the same: once delivery started it is stopped, keeps its claim and metrics observation until its
    handler invocations have
    returned, and returns nats.ErrConnectionClosed with no handle (Codex F21); arming the circuit
    timer stops a pending one from an earlier
    round, which an untracked timer could otherwise outlive Close (:568-570; the pin never kept or
    stopped it, :289). natsclient-close-is-final (Codex F21, PR #48 comment 5980134911): Close
    returns nil only after every message handler invocation (Subscribe, SubscribeForRequests, the
    three Consume methods), the connection's event handlers (the installed connection's
    ClosedHandler has returned) and the async publish error handler have finished, on every Close
    path, except an async publish error handler invocation that starts after the join completed,
    which runs unjoined because nats.go gives that goroutine no end signal (reply-subscription
    callback at a forced close, resetPendingAcksOnReconnect, jetstream/publish.go:607-624) and is
    safe because it then only counts the publish_async metric and logs at debug level; the client
    observes handler ends itself because nats.go v1.54.0 force-closes without
    waiting (nats.go:6196-6227), ends a drain after its timeout with a callback running (:6349-6372,
    :6389-6390), and its consumer Closed() closes at once for an invalid subscription
    (jetstream/pull.go:822-837); a delivery handed over after the client recorded its consumer's or
    subscription's end does not run the handler (ack explicit or all: left unacknowledged for
    redelivery; AckNone and core: lost, as the buffered messages the native library discards at the
    same moment are, nats.go:3801-3803, :3817-3828), is logged at warn level and is counted as
    recordError("late_delivery_refused") when JetStream metrics are configured, a label that also
    counts core subscriptions; the owner accepted that AckNone loss (question 4,
    #9 comment 5980769459); Subscribe and SubscribeForRequests return nats.ErrConnectionClosed once
    Close has begun; a Connect that returns an error has no handler of its dialled connection still
    running. natsclient-close-honours-each-context (Codex F22): a Close or Connect never waits on
    another caller's drain to observe its own context. natsclient-status-ownership (Codex F23): a
    Connect that loses to an installed connection changes neither Status, Failures nor the circuit;
    once Close has begun only Close changes Status, which keeps its value through the drain and is
    Disconnected for good once the cleanup has finished; Connect after Close refuses before dialling
    (the pin dialled). Each changed behaviour above is an adapt item with its test (design D3; task
    3.7c2; the new tests named in (1)-(9) are in the new file client_close_final_test.go; new
    production file natsclient/owned_delivery.go, ownedDelivery, beyond the pin: design D3
    natsclient-close-is-final, Codex F21; #9 comments 5980296112, 5980769459): (1) Subscribe and SubscribeForRequests after Close has begun return
    nats.ErrConnectionClosed, where the pin returned ErrNotConnected after Close or subscribed on
    the draining connection (the closing and closed rows of TestClientLifecycleOperationTable;
    the carried TestContextAwareMethods, client_test.go:386-389, now asserts it); (2)
    consumer setup is refused before native Consume once Close has begun
    (TestClientLifecycleOperationTable); setup that already started delivery keeps its claim until
    its handlers return (TestClientRefusedConsumerKeepsOwnershipUntilHandlersReturn,
    TestClientRefusedConsumerSetupContextEndsWhileHandlerRuns); (3) a losing Connect returns only
    after its candidate connection's event handlers have returned
    (TestClientLosingConnectLeavesNoCandidateHandler); (4) a late delivery after the recorded end is
    refused, logged at warn level and counted as the JetStream error metric's late_delivery_refused
    operation; AckNone and core lose it (TestClientRefusesLateDeliveryAfterRecordedEnd); (5) Status
    is frozen once Close has begun and Disconnected after the cleanup
    (TestClientHealthMonitorCannotOverwriteClosedStatus,
    TestClientFailuresAfterCloseLeaveStatusDisconnected,
    TestClientEventHandlerCannotCommitAfterClose,
    TestClientAsyncPublishErrorAfterCloseRecordsMetricOnly); (6) the async publish error handler,
    once Close has begun, records its metric and log but no failure
    (TestClientAsyncPublishErrorAfterCloseRecordsMetricOnly,
    TestClientCloseJoinsRunningAsyncPublishErrorHandler); (7) Connect after Close refuses before
    dialling (TestClientConnectAfterCloseRefusesBeforeDial); a Close or Connect never waits on
    another caller's drain (TestClientCloseHonoursItsContextDuringAnotherDrain,
    TestClientConnectDuringCloseDrainReturnsPromptly); (8) Close reports a drain timeout the same
    way whichever timer ran out first: the first Close returns a transient error wrapping
    nats.ErrDrainTimeout (the client's own timer branch did not wrap it), where the pin and 7ce1940
    returned nil once the native drain gave up and closed (TestClientCloseReportsDrainTimeout); (9)
    Close unsubscribes a client-owned subscription on a connection replaced through SetConnection
    and joins its handler, discarding its buffered messages, and treats an Unsubscribe error there
    as the subscription already ending; likewise, when Close
    begins, it stops through its native handle a client-created consumer whose connection (the
    one its JetStream handle was made on, read with that handle) was replaced, and releases its claim and observation once its handlers have returned (Codex F26,
    PR #48 comment 5981562076; TestClientCloseEndsConsumerOnReplacedConnection and
    TestClientCloseAttributesConsumerToItsHandlesConnection, internal and port);
    the replaced connection itself belongs to the SetConnection
