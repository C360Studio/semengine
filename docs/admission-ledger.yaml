# Admission ledger: one entry per SemStreams source path reused, adapted, or read and excluded in this
# repository. Rules: docs/provenance.md. Location and format: owner ruling 2026-09-30 on PR #13.
#
# Schema: a YAML list; every entry has these ten fields, all non-empty:
#   source_path                   SemStreams path, unique across entries
#   source_sha                    full 40-character lowercase commit SHA the file was read at
#   consumer_purpose              what SemEngine consumer needs it, or why none does
#   destination                   SemEngine path it lands in, or none
#   contract                      behavior the destination must keep
#   dependencies_and_side_effects imports, tools, and effects it brings
#   known_risks                   upstream defects and what is not carried
#   proving_tests                 tests that prove the destination
#   owner                         who answers for the entry
#   disposition                   one of carry | adapt | repair-before-port | defer-exclude
#
# `task ledger:check` (contract test T-B7, internal/harness/contract/ledger_test.go), run inside
# `task verify`, enforces this schema. Every entry below is re-checked at SETUP 03A. No SemStreams
# package has been ported; the SETUP 02 rows record patterns adapted, two scripts carried, and exclusions.

- source_path: natsclient/test_client.go
  source_sha: 5457b3458936f668b71d2fea061f67f8d7d01e67
  consumer_purpose: >-
    pattern for the owned disposable NATS fixture (phased setup, typed failure, one mapped-port
    replacement, fresh per-operation cleanup deadlines, bounded test streams)
  destination: >-
    internal/harness/natsfixture (reimplemented over nats.go and testcontainers-go; no natsclient.Client)
  contract: >-
    Start phases image→create→ready log→host→mapped 4222→connect→JetStream ready; failure record
    {attempt, phase, container id, parent state, cause, cleanup}; terminate a container returned with
    an error; Stop once, replayed
  dependencies_and_side_effects: >-
    testcontainers-go v0.44.0 (upstream pins v0.40.0, whose docker/docker client carries two unfixed
    advisories) and nats.go v1.54.0; creates a container per fixture; writes evidence files
  known_risks: >-
    production package imported testing/testcontainers upstream (not carried); mutable tag pin upstream
    (replaced by digest); eleven caller knobs upstream (dropped)
  proving_tests: >-
    natsfixture owner tests S1-1..S1-9; lifecycletest.Run over the fixture adapter; T-B1, T-B2, T-B3
  owner: setup-02 developer
  disposition: adapt

