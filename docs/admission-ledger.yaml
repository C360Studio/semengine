- source_path: pkg/cache
  source_sha: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
  consumer_purpose: >-
    generic caches (simple, LRU, TTL, hybrid) and CoalescingSet; imported by natsclient
    (TemporalResolver); no consumer imports it and no public signature names its types once
    natsclient's GetStats is unexported (design D5, P21, P22)
  destination: internal/cache
  contract: >-
    Cache[V] get, set, delete, clear, size, keys, statistics and close as at the pin; LRU size
    eviction, TTL expiry on read and in the background cleanup; NewFromConfig validation; WithMetrics
    exports the statistics as Prometheus collectors; CoalescingSet add, remove, prefix removal,
    drain and one deduplicated batch per window as at the pin. Changed behavior, each written
    first. Design D9: newCacheMetrics registers its six collectors through metric.RegisterOrGet and
    keeps the collectors it returns, so caches sharing a prefix on one registry share one collector
    per metric (the collectors are interface-typed; RegisterOrGet compares the concrete type).
    Design D7, background-work shape 3: CoalescingSet.Shutdown(ctx) replaces Close(); it returns nil
    once the goroutine has exited, ctx.Err() if ctx ends while the caller's callback still runs, and
    nil on a later call once the callback has returned; Shutdown(nil) is refused with an error;
    NewCoalescingSet panics on a nil context before it starts the goroutine. Design D7, shape 2: the
    TTL and hybrid Close signal the cleanup goroutine and wait for it with no fixed bound; NewTTL and
    NewFromConfig refuse a nil context with an error, for every strategy. Every constructor that
    returns Cache[V] with an error (NewSimple, NewLRU, NewTTL, the hybrid constructor, and
    NewFromConfig through them) returns a nil Cache on error; at the pin each returned its nil
    pointer inside a non-nil Cache (pin config.go:152, :159, :170, :177). Owner ruling (#9 comment 5950725772): no eviction
    callback. Changed behavior, task 3.6a (Codex review, PR #48 comment 5968489295; owner rulings,
    #9 comments 5968830525 and 5968665464), each written first: a CoalescingSet callback panic is
    not recovered and ends the process, and a nil callback panics at the call before the goroutine
    starts (F1); concurrent Close calls on the TTL and hybrid caches are safe and each returns only
    once the cleanup goroutine has exited (F2); NewLRU, NewTTL and the hybrid constructor refuse a
    zero or negative size, TTL or cleanup interval with a classified invalid error, a nil Cache and
    no goroutine started, as Config.Validate already did for NewFromConfig (F3); Config's JSON
    decoder refuses unknown keys, stats_interval included, and treats a JSON null as a no-op (F4,
    F5). Removed as dead surface (owner ruling #9 comment 5968830525, after a pin-wide reference
    search): Config.StatsInterval and WithStatsInterval, Entry with IsExpired and Touch, WithStats,
    StatsFromContext, ContextKeyStats, and Statistics.MemoryUsage, UpdateMemoryUsage and
    StatsSummary.MemoryUsage
  dependencies_and_side_effects: >-
    metric, pkg/errs (in-set); prometheus/client_golang; stdlib; pgregory.net/rapid in tests only.
    The TTL and hybrid caches run one cleanup goroutine each, joined by Close; CoalescingSet runs
    one goroutine that calls the caller's callback, joined by Shutdown within its context
