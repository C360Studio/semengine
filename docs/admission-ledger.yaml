- source_path: pkg/cache
  source_sha: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
  consumer_purpose: >-
    generic caches (simple, LRU, TTL, hybrid) and CoalescingSet; admitted whole because six
    admitted packages import it at the pin (design D1); nothing in this change imports it, since
    natsclient's one importer, TemporalResolver, is dropped as dead surface (owner ruling, #9
    comment 5969522395, item 1); no consumer imports it and no public signature names its types
    (design D5, P21, P22)
  destination: internal/cache
  contract: >-
    Cache[V] get, set, delete, clear, size, keys, statistics and close as at the pin; LRU size
    eviction, TTL expiry on read and in the background cleanup; NewFromConfig validation; WithMetrics
    exports the statistics as Prometheus collectors; CoalescingSet add, remove, prefix removal,
    drain and one deduplicated batch per window as at the pin. Changed behavior, each written
    first. Design D9: newCacheMetrics registers its six collectors through metric.RegisterOrGet and
    keeps the collectors it returns, so caches sharing a prefix on one registry share one collector
    per metric (the collectors are interface-typed; RegisterOrGet compares the concrete type).
    Design D7, background-work shape 3: CoalescingSet.Shutdown(ctx) replaces Close(); it returns nil
    once the goroutine has exited, ctx.Err() if ctx ends while the caller's callback still runs, and
    nil on a later call once the callback has returned; Shutdown(nil) is refused with an error;
    NewCoalescingSet panics on a nil context before it starts the goroutine. Design D7, shape 2: the
    TTL and hybrid Close signal the cleanup goroutine and wait for it with no fixed bound; NewTTL and
    NewFromConfig refuse a nil context with an error, for every strategy. Every constructor that
    returns Cache[V] with an error (NewSimple, NewLRU, NewTTL, the hybrid constructor, and
    NewFromConfig through them) returns a nil Cache on error; at the pin each returned its nil
    pointer inside a non-nil Cache (pin config.go:152, :159, :170, :177). Owner ruling (#9 comment 5950725772): no eviction
    callback. Changed behavior, task 3.6a (Codex review, PR #48 comment 5968489295; owner rulings,
    #9 comments 5968830525 and 5968665464), each written first: a nil callback panics at the call
    before the goroutine starts (F1; F1's other half, a callback panic ending the process, is
    replaced below); concurrent Close calls on the TTL and hybrid caches are safe and each returns only
    once the cleanup goroutine has exited (F2); NewLRU, NewTTL and the hybrid constructor refuse a
    zero or negative size, TTL or cleanup interval with a classified invalid error, a nil Cache and
    no goroutine started, as Config.Validate already did for NewFromConfig (F3); Config's JSON
    decoder refuses unknown keys, stats_interval included, and treats a JSON null as a no-op (F4,
    F5). Removed as dead surface (owner ruling #9 comment 5968830525, after a pin-wide reference
    search): Config.StatsInterval and WithStatsInterval, Entry with IsExpired and Touch, WithStats,
    StatsFromContext, ContextKeyStats, and Statistics.MemoryUsage, UpdateMemoryUsage and
    StatsSummary.MemoryUsage
  dependencies_and_side_effects: >-
    metric, pkg/errs (in-set); prometheus/client_golang; stdlib; pgregory.net/rapid in tests only.
    The TTL and hybrid caches run one cleanup goroutine each, joined by Close; CoalescingSet runs
    one goroutine that calls the caller's callback, joined by Shutdown within its context
  known_risks: >-
    Context roots, the one D1 count: example code inside a doc comment (pin doc.go:255), not
    executable; the package has no production root. Port-refactor rows for later callers (design
    D5): CoalescingSet.Close becomes Shutdown(ctx) (pin processor/graph-embedding/component.go:875,
    processor/rule/entity_watcher.go:980); WithEvictionCallback is deleted (pin
    processor/rule/expression/regex_cache.go:21, a no-op callback; the pin's natsclient/kv_temporal.go:27,
    :59 leave with TemporalResolver, task 3.7). Shared collectors: two caches under one prefix share the size gauge, which shows
    whichever cache wrote last, not a sum (at the pin the second cache's gauge was not gathered at
    all). Removed with the eviction callback (owner
    ruling, #9 comment 5950725772; design D7): WithEvictionCallback (pin options.go:42-48, with the
    evictCallback field :23-24), EvictCallback (cache.go:51-53), and the evictFn plumbing in
    simple.go, lru.go, ttl.go and hybrid.go; TestEvictCallback (cache_test.go:444-503, 60 lines, two
    subtests, two of the package's 26 sleeps) is deleted with it (design D8). Removed by shape 3:
    CoalescingSet.Close (coalescing_set.go:114-126). Removed by shape 2: the fixed 5 s wait in the
    TTL and hybrid Close (ttl.go:258-264, hybrid.go:285-291). doc.go adapt items, pin lines: the
    eviction examples and prose at :39-41, :157, :162, :179 and :234-236 removed; the "Context and
    Cleanup" section (:250-261) gains Close's join, the nil-context refusals and CoalescingSet's
    Shutdown. README behavior edits (owner ruling, #9 comment 5957221949), pin lines: the eviction
    callback examples at :64-66, :200-202 and :410-412 and the WithEvictionCallback section
    :117-125 removed. README import paths (not a behavior edit, as on the metric row): :17 and :41
    changed to github.com/c360studio/semengine/internal/cache and /metric. README lint fix: line 3
    wrapped at 120 columns (MD013); no other wording changed. Task 3.6a (Codex PR #48 comment 5968489295; owner
    rulings #9 comments 5968830525, 5968665464). Changed behavior (owner ruling, #9 comment
    5994720412 item 3, applying 5985697767 item 3 in place of the F1 reading of 5968830525 that let
    a callback panic end the process): fireBatch recovers a callback panic, as the pin did (pin
    coalescing_set.go:167-180), but where the pin discarded it (`_ = r`) the batch is now dropped
    with an error log naming the panic and the batch size and an increment of the counter
    WithPanicCounter supplies; later batches still fire. New surface for it: CoalescingOption,
    WithPanicLogger (default slog.Default()) and WithPanicCounter, the variadic options of
    NewCoalescingSet. Removed, pin lines: the
    check-then-close in the TTL and hybrid Close (ttl.go:251-256, hybrid.go:278-283), replaced by a
    sync.Once; StatsInterval (config.go:46-47, :58, :103-106, :123-126, :232, :260-267; options.go:26-27,
    :50-59, :66; ttl.go:34, :67; hybrid.go:38, :73; doc.go:163; README.md:67, :127-133, :194); Entry,
    IsExpired, Touch, contextKey, ContextKeyStats, WithStats and StatsFromContext (cache.go:55-94);
    memoryUsage, UpdateMemoryUsage, MemoryUsage and StatsSummary.MemoryUsage (stats.go:23, :68-72,
    :114-119, :172, :185, :202). Pin-wide reference search (the pin and the four consumers named in
    docs/inventory-scope.md): none of the removed symbols has a reader outside pkg/cache; the one
    other reference is a setter, processor/rule/config.go:245 (StatsInterval: 30s), with
    processor/rule/docs/configuration.md:219, :231 documenting stats_interval: a port-refactor item
    for processor/rule, whose stats_interval key now fails to decode. Config.UnmarshalJSON decoded
    into &aux (config.go:238), so a JSON null set aux to nil and panicked; it now decodes into aux.
    doc.go behavior edits (rule 2(c)), pin lines: cache.NewHybrid, which the package does not have,
    replaced by NewFromConfig with StrategyHybrid at :37-39, :72, :216 and :227-229; :267 and :271
    name ./internal/cache; :286 no longer points at a nonexistent examples_test.go. README behavior
    edits: cache.NewHybrid replaced the same way at :35, :102 and :403-411
  proving_tests: >-
    the 6 test files in pkg/cache/ at the pin, carried to internal/cache/ and repaired. New, written
    first, in internal/cache/metrics_test.go: TestCacheMetricsTwoCachesOnePrefixGatherTheSum (two LRU
    caches under one prefix on one registry; oracle: the operations the test performs, counted by hand,
    each gathered on one series; at the pin the second cache's writes were not gathered,
    implementer-reported). In internal/cache/background_test.go, each run inside synctest.Test:
    TestCoalescingSetShutdownLeavesNothingRunning, TestTTLCacheCloseLeavesNothingRunning and
    TestHybridCacheCloseLeavesNothingRunning (start, use, stop; oracle: the stop returns nil within an
    hour of the bubble's clock with the goroutine's done channel already closed, and the bubble returns;
    at the pin's behavior the TTL and hybrid tests pass, because the fixed wait shows only when the
    goroutine does not exit), TestCoalescingSetNilContextPanicsAtTheCall and
    TestCacheConstructorsRefuseNilContext (at the pin the goroutine panicked: coalescing_set.go:136,
    ttl.go:276), TestCoalescingSetShutdownUnderABlockedCallback (oracle: context.DeadlineExceeded while
    the callback is held, nil after it returns; at the pin's Close the bubble deadlocked) and
    TestCoalescingSetShutdownRefusesNilContext; TestCacheCloseAfterContextEndAndAgain (a Close after the
    context ended the goroutine, then a second Close, both nil; not a changed behavior, it passes at the
    pin's behavior too); TestCacheConstructorsReturnNilCacheOnError (each constructor above,
    NewFromConfig for every strategy, refused by a metrics registration collision; oracle: err != nil
    and the returned Cache == nil; implementer-reported, it failed first for NewSimple, NewLRU and
    NewFromConfig's simple and lru paths with a nil *simpleCache or *lruCache inside the Cache).
    Generated check, in internal/cache/coalescing_set_prop_test.go: TestPropCoalescingSetHistory, a
    Rapid history of Add, Remove, RemovePrefix, Drain, window ticks and Shutdown, each run in its own
    bubble and compared after every step with a test-owned model; it logs how often each assertion ran;
    and TestCoalescingSetRemovePrefixMatchesOnlyAtTheStart, the boundary the generator reaches only by
    chance. D8 repairs (R1a, sleep to the bubble's clock, unless named), pin → SemEngine:
    coalescing_set_test.go:137 → :143; :148 → :158; :257 → :271; :308 → :323; :318 → :334; :339 → :356;
    :348 → :366; :428 → :447; :446 → :465; :516 → :537; :522 → :543; :527 → :548; the 10 ms not-yet
    window (:89-94) → :94-100, after synctest.Wait; :586, :592 and :611 went with
    TestCoalescingSet_CallbackPanic and TestCoalescingSet_NilCallback, replaced in task 3.6a;
    coalescing_set_attack_test.go:105 → :114 (R1b: the callback is held on a channel the test releases;
    the test stays on the real clock, because an Add blocked on the set's mutex would stall a bubble
    instead of failing it; 10 s failure bound at :142); :177 → :200; :223 → :245-256 (a sentinel key:
    the pin asserted a callback after a fixed 300 ms, which failed whenever the removers had emptied the
    set; now one window, one callback, nothing pending); :241 → :270; :298 → :334-335 (wait for the
    first delivery: a zero window ticks every nanosecond of the bubble's clock); cache_test.go:294 →
