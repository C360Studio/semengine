    meta source that is not valid UTF-8 with an invalid-data error. Changed behavior (owner ruling,
    #9 comment 5970334875, extending ruling 2): BaseMessage.MarshalJSON refuses a message type
    whose domain, category or version is not valid UTF-8, with an invalid-data error;
    message.Type.Validate (pkg/types row) refuses such a component. Changed behavior (owner
    rulings, #9 comments 5972117486 and 5972208367): GenericJSONPayload.Data holds JSON-shaped
    values only (map[string]any, []any, string, a Go number, json.Number, bool, nil, nested);
    MarshalJSON refuses any other value, time.Time included, with an invalid-data error naming its
    type and path (data.a[2].b), as well as a string or map key that is not valid UTF-8 and a map or
