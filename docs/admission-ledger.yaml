- source_path: natsclient
  source_sha: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
  consumer_purpose: >-
    the NATS and JetStream client: connection lifecycle and health status,
    streams, consumers with delivery settlement, KV buckets and watchers, request/reply, and
    JetStream metrics (storage inventory, pressure and reports are the sub-package natsclient/storagereport); SemSource imports it, so it stays public
    at its pin path (design D5)
  destination: >-
    natsclient (storage_*.go and their tests live in natsclient/storagereport since
    simplify-04a-13 (#222))
  contract: >-
    Client, its options and every exported operation as at the pin, less the surface named under
    known_risks as dropped. Changed surface, simplify-04a-13 (#222): the storage report code is the
    package natsclient/storagereport (D1), with nine renames of names that began with the package name
    (PublisherConfig, Publisher, ResourceKey, Observer, Snapshot, ConsumerConfig, Consumer, NewPublisher,
    NewConsumer); Client.AccountStreamLister is the function storagereport.AccountStreamLister(client) (D2); 22
    names with no caller in this repository are unexported (D2, Exports); Observer gains ForgetAccount(row), called
    when the consumer drops a held account row, so an observer is told as it is for resources (D3, #85).
    Changed surface, simplify-04a-16 (#222): the connection circuit breaker is removed, and the
    connection status is a typed atomic that Status() reads without the client's lock. Removed:
    StatusCircuitOpen, natsclient.ErrCircuitOpen (and errs.ErrCircuitOpen), Client.Failures,
    Client.Backoff, and Status.FailureCount, LastFailureTime and Reconnects; Client.RTT and the
    health monitor stay. Connect dials each time it is called, bounded by its context, and a failed
    call refuses no other call. The records below that name the breaker, its timer or its tests
    (circuit threshold, Failures(), the circuit-open rows) describe the pin and the earlier
    changes, and are history.
    Changed surface, simplify-04a-18 (#169, #222): newJetStreamMetrics also registers the counter
    semengine_nats_server_refusals_total{reason} (12 collectors in all), and handleError adds one,
    before it logs, for a nats.ErrPermissionViolation (reason permission_violation) or a
    nats.ErrMaxSubscriptionsExceeded (reason max_subscriptions_exceeded) that nats.go reports; a refused
    PUB and a refused SUB count alike, and Subscribe still returns the subscription and nil (owner ruling
    on #169, 2026-10-12; TestServerRefusalCountedBeforeLog). The three synchronous stream publishes share
    one connection and JetStream check and one message builder; PublishToStream and
    PublishToStreamWithMsgID return nats.go's error unchanged, and PublishToStreamWithAck still counts
    only a failed publish as publish_to_stream and wraps it as transient (the AutoCreate doc line is
    removed; TestIntegration_PublishToStreamErrorsPerCall). KVStore.KeysByFilter and FilteredKeys list
    keys through one function over WatchFiltered: FilteredKeys now takes a reader that offers
    WatchFiltered (it took one offering ListKeysFiltered), completes as KeysByFilter does, and returns
    nil and no error when no key matches (TestIntegration_FilteredKeyListingsNoMatch).
    collectFilteredKeys and the ErrNoKeysFound and ErrKeyNotFound branches are removed.
    Changed surface, simplify-04a-17 (#133): IsKVTombstone, moved from graph/kvcatalog.
    Changed surface, graph-ingest-metering (#300 section B; owner answer 2026-10-18, question 3):
    ErrorCodeResponseTooLarge exports "response_too_large", the code SubscribeForRequests answers a
    reply too large to publish with (unexported before); graph-ingest's prefix query returns the same
    code when no page fits (TestIntegration_SubscribeForRequestsPublishesBeforeClassifyingResponseLimit,
    TestQueryRefusalsCarryACode).
    Changed behavior, design D9 (task 3.7): newJetStreamMetrics registers
    all 12 collectors through metric.RegisterOrGet and keeps the collector each call returns
    (jetstream_metrics.go:128-161 at the pin, where 8 went through the removed Register* methods,
    task 3.5a), so a second client on the same registry writes to the canonical collector. Changed
    behavior, design D9 (task 3.7d; owner ruling #9 comment 5969522395, item 4): the three consumer
    counters that added the server's current values on every poll (jetstream_metrics.go:305-307
    at the pin → :309-311, so each poll doubled them) are gauges set from server state:
    consumer_delivered_total → consumer_delivered_stream_sequence (Delivered.Stream),
    consumer_acked_total → consumer_ack_floor_stream_sequence (AckFloor.Stream),
    consumer_redelivered_total → consumer_redelivered_messages (NumRedelivered). No client label.
