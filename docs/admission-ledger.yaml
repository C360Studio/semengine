    once the handler has returned). Task 4.1, settlement (design D4; transport-client "Settlement
    follows the decision"), the natsclient half: the pin's 18 unit tests in
    delivery_settlement_test.go, with TestConsumeDeliveryWithHeartbeatErrCarriesControlLoss added in
    task 3.7b, and its 3 integration tests in delivery_settlement_integration_test.go, which run on
    natsfixture through newFixtureClient. Scenarios: long work with heartbeat →
    TestIntegrationConsumeDeliveryWithHeartbeatHealthyRenewalPreventsOverlap; stopped heartbeat →
    TestIntegrationConsumeDeliveryWithHeartbeatStoppedRenewalUsesBackOff; semantic retry →
    TestIntegrationSemanticRetryProducesDurableRedelivery; work panics →
    TestConsumeDeliveryWithHeartbeatControlLossNormalizesInvalidAndPanic and
    TestConsumeDeliveryWithHeartbeatPanicAndZeroPolicyFailClosed. Task 4.2, acknowledged is not
    durable, the natsclient half: TestIntegration_AcknowledgedIsNotDurableOnMemoryStream
    (integration_test.go) publishes through PublishToStream to a memory-backed and a file-backed
    natsfixture stream, reads both back, restarts the fixture, and finds the file-backed message
    and not the memory-backed one. The graph-ingest half of both requirements, and its scenarios,
    are change 2's (design D4). Owner ruling #9 comment 5994720412 item 2, separate setup and
    handler contexts: TestConsumeSetupDeadlineDoesNotEndLaterHandlers and
    TestConsumeHandlerContextEndsWhenCloseBegins (consume_context_test.go), each over the internal
    and port paths, failed first on both. Mutation (implementer-reported, PR #48): Close not
    cancelling the handler context in either path, port handlers parented by the setup context, and
    internal handlers parented by the setup context: each fails its test; restored, they pass.
    TestConsumeHandlerContextEndsWhenCloseBeginsAfterDeliveryEnded (delivery ended by a native end
    while a handler with DisableMessageTimeout runs, then Close; failed first on both paths at
    5ecc016, reviewer early check HIGH) and TestConsumeHandlerContextEndsWhenCloseBeginsBeforeTheHandle
    (native Consume delivers before returning its handle and Close begins in that window). Mutation:
    the cancel removed from owned_delivery.go ownConsumer's closing case before the handle (it
    survived the whole unit suite at 5ecc016), and from the closing case while it waits for the last
    handler: each fails its test on both paths; restored, they pass
