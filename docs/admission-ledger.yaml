    MarshalJSON wrote meta.source through encoding/json, which replaces each byte of a string that
    is not valid UTF-8 with U+FFFD, so the wire carried a different source and nothing said so.
    MarshalJSON now refuses such a source with an invalid-data error, checked at encoding because
    NewBaseMessage returns no error and WithMeta accepts any Meta. Decoding is unchanged: JSON
    text is UTF-8, so a decoded source is always valid. Behaviour change, type and generic payload
