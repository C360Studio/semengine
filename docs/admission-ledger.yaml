    that is not valid UTF-8 (BaseMessage.Validate checks only that each component is non-empty, so
    the check is at encoding, beside the source's). Behaviour change, generic payload shapes (owner
    rulings, #9 comments 5972117486 and 5972208367; Codex F15 and F16, PR #48 comment 5970889953):
