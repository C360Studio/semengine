    and StartWithListener bind synchronously and refuse a nil or ended context, a used instance and
    a nil registry; Address; a repeated completed Stop is a nil no-op; concurrent Stop is a typed
    transient error. Changed behavior (design D3), each written first: Stop returns its context's
    error whenever that context has ended, including after an idle server's Shutdown returned nil
    (metric-abort-stop-reports-context, pin handler.go:222-228); after a forced close Stop waits on
    the serve goroutine with no timer (metric-forced-join-without-timer: forcedServeJoinTimeout, pin
    :23, :243-249, removed). Changed behavior (PR #48 review finding, owner-approved), written first:
    Start applies the server mTLS configuration through tlsutil.LoadServerTLSConfigWithMTLS, so
    RequireClientCert refuses a client with no certificate; at the pin Start called
    LoadServerTLSConfig (pin handler.go:154) and no metric file names MTLS (pin grep), so the policy
    was dropped; Start refuses mTLS enabled with server TLS disabled (ErrInvalidConfig) instead of
    serving plain HTTP. Changed behavior (PR #48 review finding, owner-approved), written first: a
    request the handler admitted, with the collection it runs, is the Server's work until the
    handler returns; Stop waits for it within ctx after the serve join, returns ctx's error and
    leaves it pending when ctx ends first, and a repeated Stop waits again and returns nil only once
    it has finished; at the pin the forced path cleared its state after the serve join and the
    repeated Stop returned nil at once (pin handler.go:202-206). Changed behavior (Codex review of
    PR #48, comment 5959412053, finding 1), written first: Stop closes admission before it shuts
    down, so a request that reaches the handler after Stop has begun is refused with 503 and its
    handler never runs; admission closed and no request running are observed under one lock, so a
    nil Stop is final. Changed behavior (design D9; Codex
    review finding 4, PR #48 comment 5956732582; owner-accepted 2026-10-02), written first:
    RegisterOrGet[C] keeps one canonical collector per logical key, of the exact concrete type and
    descriptors; a nil candidate, a type or descriptor mismatch, and a cross-key alias are refused
    with a fatal error and nothing stored. A caller uses the returned collector, never its own
    candidate (AGENTS.md rule index, review only)
