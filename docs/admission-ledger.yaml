    timestamps through timestamp.Parse (base_message.go:272-284), which reads a number up to 10^12 as
    seconds and also accepts RFC 3339 and numeric strings, so every instant before 2001-09-09, which
    MarshalJSON writes as fewer than 10^12 milliseconds, decoded wrong (1999-01-01 as year 30969, any
    pre-1970 instant thousands of years earlier), and an unreadable value silently became the zero
    time. Replaced by wireMillis: the wire is decoded with json.Decoder.UseNumber (pin :263's
    json.Unmarshal) so the literal is read exactly, and anything but an integer in int64's range is
    refused. internal/timestamp is unchanged; timestamp.Parse has no caller left in the module.
