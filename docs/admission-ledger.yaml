# Admission ledger: one entry per SemStreams source path reused, adapted, or read and excluded in this
# repository. Rules: docs/provenance.md. Location and format: owner ruling 2026-09-30 on PR #13.
#
# Schema: a YAML list; every entry has these ten fields, all non-empty:
#   source_path                   SemStreams path, unique across entries
#   source_sha                    full 40-character lowercase commit SHA the file was read at
#   consumer_purpose              what SemEngine consumer needs it, or why none does
#   destination                   path it lands in, relative to the repository root and inside it,
#                                 optionally followed by a note; or none
#   contract                      behavior the destination must keep
#   dependencies_and_side_effects imports, tools, and effects it brings
#   known_risks                   upstream defects and what is not carried
#   proving_tests                 tests that prove the destination
#   owner                         who answers for the entry
#   disposition                   one of carry | adapt | repair-before-port | defer-exclude
#
# `task ledger:check` (contract test T-B7, internal/harness/contract/ledger_test.go), run inside
# `task verify`, enforces this schema. It then compares every `carry` entry with the pin (SemStreams at
# the entry's source_sha, fetched from GitHub; docs/provenance.md rule 5). The tree side is the
# destination path: the leading run of letters, digits, `/`, `.`, `_` and `-` in `destination`;
# anything after it is a note. `task ledger:diff -- <source_path>` prints the differences of any entry;
# `adapt` entries are printed there and never failed. Every entry below is re-checked at SETUP 03A.
# The SETUP 02 rows record patterns adapted, two scripts carried and later adapted (flake-defense), and
# exclusions; the package rows of change setup-04a-01-floor follow them.
#
# Port refactors (owner ruling on #8, Q4; SETUP 03B design.md D4a): restructuring ported code away from
# the pin's shape (a seam, a file-level adapt, a dropped field or method) is disposition `adapt`, with
# `contract` citing its retained-contract-matrix row, `proving_tests` naming the test that proves the
# retained behavior, and `known_risks` naming `class:port-refactor` and its tracking issue (#25-#36).

