# importer, composition (owner, 2026-10-19: Decision A, Q2 "let's fix them").

- source_path: component/flowgraph
  source_sha: 8b99efe9c66a4faa4fa509f9f62cc6bad8392128
  consumer_purpose: >-
    the flow-graph analysis composition.Analyze runs over component declarations (pin composition/analyze.go:42,
    :59, :81, :125; composition/graph.go:93), ported later in change 3 (setup-04a-foundation design D2 row 3);
    carried ahead of its importer in the owner's order (#9 comment 6270875286); internal because no consumer
    imports it and no exported signature in a public package names its types (#9 comment 5953295358)
  destination: internal/flowgraph
  contract: >-
    as at the pin, except: (1) graph-mutation membership and shape come from graphmutation.ClassifyPort
    (one-mutation-port-check, #323); (2) the
    graph-mutation check and the connected-component walk visit components in name order, so equal declarations
    give equal refusals and equal results; (3) removed as dead: GetNodes, EdgeMetadata and FlowEdge.Metadata,
    FlowAnalysisResult.ConnectedEdges, StreamRequirementWarning.Severity and Issue; ComponentNode, PortInfo,
    NewFlowGraph and ConnectComponentsByPatterns unexported (componentNode, portInfo, newFlowGraph,
    connectComponentsByPatterns); no JSON tags; (4) README.md and doc.go describe the code; (5) one port-map
    builder, one concrete-subject choice, and matchNATSPattern asked once per pair, which it answers both ways;
    (6) the interface-alternative heuristic and IssueOptionalInterfaceUnused removed, so an unconnected input
    that is not required reports no_publishers; (7) the empty or duplicate name, KV-writer and
    graph-mutation refusals are plain text wrapping errs.ErrInvalidConfig and name no internal function (the
    port/fact count and connection-identity refusals are plain text with no sentinel, as at the pin); (8) a `>`
    in a subject matches one or more trailing tokens, never none, so `events.>` and `events` do not match (at the
    pin they did; #326); (9) the network-bind refusal is removed, since component.Registry refuses every
    exclusive-address conflict at admission (one-exclusive-address-check, #324); (10) ComponentPortRef carries the
    port's Direction, and the orphan check keys ports by instance, direction and name, so a connected output never
    marks a same-named input connected, and a request port matching a same-named input and output gets two edges,
    not one (port-composition, #346; the pin has the defect).
    BuildFromDeclarations refuses an empty or duplicate instance name, a port/fact count mismatch and a port
    with no connection identity, then derives edges: stream and request by wildcard subject match, recording
    the side without a wildcard, watch and read by exact bucket, store as fan-in from every provider to every
    reader on another component; it refuses more than one writer to a KV bucket, and, once any graph-mutation port is
    declared (a port of any kind whose interface type is semengine.graph.mutation or any one of whose NATS subjects
    starts with graph.mutation.), any such port that is not a required nats-request port for
    semengine.graph.mutation v1 on graph.mutation.>, or a count of such inputs (providers) other than one
    (ADR-091 §2, kept by ADR-110).
    AnalyzeConnectivity reports connected components, disconnected nodes and orphaned ports with an issue type and
    derives no severity; ValidateStreamRequirements reports each JetStream input fed by core-NATS publishers, with
    those publishers, each named once; SubjectCovers reports whether one subject filter covers another;
    SubjectsOverlap reports whether some concrete subject matches both of two subject filters (symmetric; a malformed
    subject overlaps nothing), which composition uses for its reserved-subject check (port-composition)
  dependencies_and_side_effects: >-
    component, internal/graphmutation, pkg/errs (in-set); stdlib (cmp, fmt, maps, slices, strings); no goroutine, no I/O
  known_risks: >-
    imported by composition (port-composition), whose port drops its IssueOptionalInterfaceUnused case; refusals are no
    longer errs-classified invalid
    (errs.IsInvalid is false; nothing at the pin reads the class); uncovered cases in notes/2.5.md
  proving_tests: >-
